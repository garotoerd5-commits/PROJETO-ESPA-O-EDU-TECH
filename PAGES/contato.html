<!doctype html>
<!-- Específica o tipo de documento HTML5 -->

<html lang="pt-BR">
  <!-- Caberça do site - configuraçção e metadadados -->
  <head>
    <!-- O 'Head' precisa necessariamente do 'title' -->
    <title>EduTech - Formação em tecnologia</title>
    <meta charset="UTF-8" />
    <!-- Configuração do teclado brasileiro -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tag de resposividade-->
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>

  <body>
    <!-- Corpo do site - Conteúdo visivél pra todos -->
    <header>
      <!-- Cabeçalho da página -->
      <div>
        <!-- Criar conteiner-->
        <a href="index.html" class="logo">Edu<span>Tech</span></a>
      </div>
      <nav>
        <a href="../index.html">Início</a>
        <!-- 'a' e 'href' para ligar com outras páginas do projeto -->
        <a href="sobre.html">Sobre</a>
        <a href="cursos.html">Cursos</a>
        <a href="contato.html">Contato</a>
      </nav>
    </header>

    <!-- Conteúdo da página -->
    <main>
      <section id="ConteinerFormContato">
        <h1>Fale com a EduTech</h1>
        <p>Tem dúvidas sobre nossos cursos? escreva sua mensagem:</p>
        <form id="FormContato">
          <label for="NomeContato">Nome completo:</label>
          <input id="NomeContato" type="text" required />
          <br />
          <br />
          <label for="EmailContato">Email:</label>
          <input id="EmailContato" type="email" required />
          <br />
          <br />
          <label for="MensagemContato">Mensagem:</label>
          <textarea
            id="MensagemContato"
            rows="5"
            required
            minlength="50"
          ></textarea>
          <br />
          <button type="submit">Enviar mensagem!</button>
        </form>
      </section>
    </main>
    <!-- ------------------ -->
    <footer>
      <!-- Rodapé da página -->
      <p>©2026 EduTech. Todos os direitos reservados</p>
      <p><a href="contato.html">Entre em contato conosco</a></p>
    </footer>
  </body>
</html>
